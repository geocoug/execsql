name: cleanup diagnostic

on:
    push:
        branches:
            - fix/cleanup-timeout

permissions:
    contents: read

jobs:
    windows-cleanup:
        runs-on: windows-latest
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                interval: ["0.005", "0.000001"]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
              with:
                  python-version: "3.11"
            - run: python -m pip install ".[formats,formatter,lsp]" --group test
            - name: Repeat cleanup with worker-state diagnostics
              shell: bash
              env:
                  CLEANUP_SWITCH_INTERVAL: ${{ matrix.interval }}
                  TMPDIR: ${{ runner.temp }}
                  TEMP: ${{ runner.temp }}
                  TMP: ${{ runner.temp }}
              run: |
                  python - <<'PY'
                  import os
                  import sys
                  import faulthandler
                  import pytest

                  class RepeatCleanup:
                      def pytest_collection_modifyitems(self, items):
                          repeated = []
                          for item in items:
                              repeated.extend(
                                  pytest.Function.from_parent(
                                      item.parent,
                                      name=f"{item.originalname}[repeat-{index}]",
                                      callobj=item.obj,
                                  )
                                  for index in range(100)
                              )
                          items[:] = repeated

                  sys.setswitchinterval(float(os.environ["CLEANUP_SWITCH_INTERVAL"]))
                  faulthandler.dump_traceback_later(5, repeat=True)
                  node = "tests/gui/test_console_connection_ownership.py::test_quit_during_connection_cleanup_finishes_on_worker"
                  raise SystemExit(pytest.main(
                      [node, "-n", "0", "--cov-fail-under=0", "-q", "-x"],
                      plugins=[RepeatCleanup()],
                  ))
                  PY
