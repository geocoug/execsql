---
name: ci/cd

on:
    push:
        branches:
            - main
        tags:
            - "v*"
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: lint
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
              with:
                  python-version: "3.13"
            - run: python -m pip install ruff
            - run: ruff check src/ tests/
            - run: ruff format --check src/ tests/

    typecheck:
        name: typecheck
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
              with:
                  python-version: "3.13"
                  cache: "pip"
            - run: python -m pip install --upgrade pip
            - run: python -m pip install ".[dev]"
            - run: mypy src/execsql/

    pre-commit:
        name: pre-commit
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
              with:
                  python-version: "3.13"
                  cache: "pip"
            - run: python -m pip install --upgrade pip
            - run: python -m pip install ".[dev]"
            # mypy runs in the dedicated typecheck job; the local hook needs uv
            - run: pre-commit run --all-files
              env:
                  SKIP: mypy

    docs:
        name: docs
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
              with:
                  python-version: "3.13"
                  cache: "pip"
            - run: python -m pip install --upgrade pip
            - run: python -m pip install ".[dev]"
            - run: cp CHANGELOG.md docs/about/change_log.md
            - run: zensical build

    tests:
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - macos-latest
                    - windows-latest
                python-version:
                    - "3.10"
                    - "3.11"
                    - "3.12"
                    - "3.13"
                    - "3.14"
        name: test-${{ matrix.os }}-py${{ matrix.python-version }}
        runs-on: ${{ matrix.os }}
        permissions:
            contents: read
        steps:
            - name: Check out repository code
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
            - name: Setup Python ${{ matrix.python-version }}
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Cache pip dependencies
              uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8  # v6.0.0
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{
                      hashFiles('**/pyproject.toml') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-${{ matrix.python-version }}-
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install tox
                  python -m pip install ".[dev]"
            - name: Install tkinter (Ubuntu)
              if: runner.os == 'Linux'
              run: sudo apt-get install -y python3-tk
            - name: Install unixodbc (macOS)
              # tox installs the [all] extra which pulls in pyodbc; pyodbc's
              # native .so depends on libodbc.2.dylib from the unixodbc
              # package, otherwise importing it fails and any DSN test bails.
              if: runner.os == 'macOS'
              run: brew install unixodbc
            - name: Test with tox
              env:
                  DISPLAY: ""
              # Ubuntu finishes in ~9 min and Windows in ~16 min; 30 leaves
              # ample headroom. Step-level timeout fails the step (not the
              # job), so continue-on-error can mask it on macOS.
              timeout-minutes: 30
              run: |
                  tox -e py
            - name: Upload coverage to Codecov
              if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
              uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: coverage.xml

    integration-tests:
        name: integration-tests-py${{ matrix.python-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version:
                    - "3.13"
        permissions:
            contents: read
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: execsql
                    POSTGRES_PASSWORD: execsql
                    POSTGRES_DB: execsql_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready --health-interval 10s
                    --health-timeout 5s --health-retries 5
            mysql:
                image: mysql:8
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_USER: execsql
                    MYSQL_PASSWORD: execsql
                    MYSQL_DATABASE: execsql_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd "mysqladmin ping" --health-interval 10s
                    --health-timeout 5s --health-retries 5
            sqlserver:
                image: mcr.microsoft.com/mssql/server:2022-latest
                env:
                    ACCEPT_EULA: "Y"
                    MSSQL_SA_PASSWORD: "ExecSql_Test123!"
                    MSSQL_PID: "Developer"
                ports:
                    - 1433:1433
                options: >-
                    --health-cmd "/opt/mssql-tools18/bin/sqlcmd
                    -S localhost -U sa -P 'ExecSql_Test123!' -Q 'SELECT 1' -No || exit 1"
                    --health-interval 10s --health-timeout 5s --health-retries 20
        steps:
            - name: Check out repository code
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
            - name: Setup Python ${{ matrix.python-version }}
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Install tkinter (Ubuntu)
              run: sudo apt-get update && sudo apt-get install -y python3-tk
            - name: Install Microsoft ODBC Driver 18 for SQL Server
              run: |
                  curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
                  curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
                  sudo apt-get update
                  sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
                  odbcinst -j
                  odbcinst -q -d
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install ".[dev,postgres,mysql,mssql]"
            - name: Run subprocess integration tests
              run: |
                  python -m pytest tests/integration/test_postgres.py tests/integration/test_mysql.py -v --override-ini="addopts="
            - name: Run in-process DB adapter tests with 86% coverage floor
              env:
                  DISPLAY: ""
              run: |
                  python -m pytest --cov=execsql --cov-branch --cov-report=xml --cov-fail-under=86
            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: coverage.xml

    access-tests-windows:
        name: access-tests-windows
        runs-on: windows-latest
        # The Access engine install step is best-effort (the redistributable
        # download from Microsoft can be flaky on hosted runners). The
        # downstream test step IS gating — a real Access regression should
        # block the merge.
        strategy:
            fail-fast: false
            matrix:
                python-version:
                    - "3.13"
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Install Microsoft Access Database Engine 2016 (x64)
              id: install_access
              continue-on-error: true
              # The chocolatey `accessdatabaseengine-x64` package was removed
              # from the community feed; download the redistributable directly
              # from Microsoft and run it silently instead.
              run: |
                  $ErrorActionPreference = 'Stop'
                  $url = 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/AccessDatabaseEngine_X64.exe'
                  $dst = Join-Path $env:RUNNER_TEMP 'AccessDatabaseEngine_X64.exe'
                  Write-Host "Downloading $url"
                  Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing
                  Write-Host "Installing $dst"
                  $proc = Start-Process -FilePath $dst -ArgumentList '/quiet','/norestart' -Wait -PassThru
                  Write-Host "Installer exit code: $($proc.ExitCode)"
                  # 0 = success, 3010 = success but reboot pending. Anything else is a failure.
                  if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) { exit $proc.ExitCode }
              shell: pwsh
            - name: Annotate skipped Access tests
              if: steps.install_access.outcome != 'success'
              run: |
                  Write-Host "::warning::Access Database Engine install failed; Access real-driver tests skipped this run."
              shell: pwsh
            - name: Install Python dependencies
              if: steps.install_access.outcome == 'success'
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install ".[dev,odbc]" pywin32
              shell: pwsh
            - name: Run Access real-driver tests
              # Gating: a real regression in src/execsql/db/access.py blocks
              # the merge. Only runs when the install above succeeded.
              if: steps.install_access.outcome == 'success'
              env:
                  DISPLAY: ""
              run: |
                  python -m pytest tests/db/test_access_windows.py -v --override-ini="addopts="
              shell: pwsh

    build:
        name: Build distribution 📦
        runs-on: ubuntu-latest
        needs: [ lint, typecheck, pre-commit, docs, tests, integration-tests ]
        # Deliberately NOT gated on tags: packaging breaks must surface on a PR,
        # not at release time. Only publish/generate-release below are tag-gated.
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
              with:
                  python-version: "3.13"
                  cache: "pip"
            - name: Build sdist + wheel
              run: |
                  python -m pip install --upgrade pip
                  # twine is pinned to the version vendored by the publish job's
                  # pypa/gh-action-pypi-publish pin (its requirements/runtime.txt).
                  # That action runs its own `twine check` before uploading, so
                  # validating here with a *newer* twine can pass while the publish
                  # fails. Bump this pin and the action pin together.
                  python -m pip install build 'twine==7.0.0'
                  python -m build --sdist --wheel --outdir dist/
                  python -m twine check dist/*
            - name: Upload dist artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  name: ${{ github.event.repository.name }}
                  path: dist/

    publish:
        name: PyPI Publish 🚀
        needs: [ build ]
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        environment:
            name: pypi
            url: https://pypi.org/p/execsql2
        permissions:
            id-token: write
            contents: read
        steps:
            - name: Download dist
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
              with:
                  name: ${{ github.event.repository.name }}
                  path: dist/
            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
              with:
                  packages-dir: dist
                  skip-existing: true

    generate-release:
        name: Generate GitHub Release
        needs: [ build ]
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
            - name: Download dist
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
              with:
                  name: ${{ github.event.repository.name }}
                  path: dist/
            - name: Create release
              uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
              with:
                  draft: false
                  prerelease: false
                  generate_release_notes: true
                  files: |
                      dist/*
