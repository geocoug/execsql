---
name: ci/cd

on:
    push:
        branches:
            - main
        tags:
            - "v*"
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: lint
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
              with:
                  python-version: "3.13"
            - run: python -m pip install ruff
            - run: ruff check src/ tests/
            - run: ruff format --check src/ tests/

    typecheck:
        name: typecheck
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
              with:
                  python-version: "3.13"
                  cache: "pip"
            - run: python -m pip install --upgrade pip
            - run: python -m pip install ".[dev]"
            - run: mypy src/execsql/

    formatter-corpus:
        name: formatter-corpus
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
              with:
                  python-version: "3.13"
                  cache: "pip"
            - run: python -m pip install --upgrade pip
            - run: python -m pip install ".[dev]"
            # Every formatter bug to date came from real SQL containing a
            # construct the project's own scripts lack.  This gate runs those
            # checks under their own name so a corpus failure is legible
            # without reading a 6,000-test log.
            - run: pytest tests/test_format.py -k corpus --no-cov -q

    typer-floor:
        name: typer-floor
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
              with:
                  python-version: "3.10"
                  cache: "pip"
            - run: python -m pip install --upgrade pip
            # Help rendering and flag parsing lean on Typer internals that
            # move between releases, and every other job runs the newest
            # Typer. Install the declared minimum, read from pyproject.toml so
            # the two cannot drift, and run the CLI tests against it.
            - run: |
                  floor=$(grep -oP '"typer>=\K[0-9.]+' pyproject.toml)
                  echo "Typer floor: $floor"
                  python -m pip install ".[dev]" "typer==$floor"
            - run: pytest tests/cli --no-cov -q

    pre-commit:
        name: pre-commit
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
              with:
                  python-version: "3.13"
                  cache: "pip"
            - run: python -m pip install --upgrade pip
            - run: python -m pip install ".[dev]"
            # mypy runs in the dedicated typecheck job; the local hook needs uv
            - run: pre-commit run --all-files
              env:
                  SKIP: mypy

    docs:
        name: docs
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
              with:
                  python-version: "3.13"
                  cache: "pip"
            - run: python -m pip install --upgrade pip
            - run: python -m pip install ".[dev]"
            - run: cp CHANGELOG.md docs/about/change_log.md
            - run: zensical build

    tests:
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - macos-latest
                    - windows-latest
                python-version:
                    - "3.10"
                    - "3.11"
                    - "3.12"
                    - "3.13"
                    - "3.14"
        name: test-${{ matrix.os }}-py${{ matrix.python-version }}
        runs-on: ${{ matrix.os }}
        permissions:
            contents: read
        steps:
            - name: Check out repository code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
            - name: Setup Python ${{ matrix.python-version }}
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Cache pip dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{
                      hashFiles('**/pyproject.toml') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-${{ matrix.python-version }}-
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install tox
                  python -m pip install ".[dev]"
            - name: Install tkinter (Ubuntu)
              if: runner.os == 'Linux'
              run: sudo apt-get install -y python3-tk
            - name: Install unixodbc (macOS)
              # tox installs the [all] extra which pulls in pyodbc; pyodbc's
              # native .so depends on libodbc.2.dylib from the unixodbc
              # package, otherwise importing it fails and any DSN test bails.
              if: runner.os == 'macOS'
              run: brew install unixodbc
            - name: Test with tox
              env:
                  DISPLAY: ""
              # Ubuntu finishes in ~9 min and Windows in ~16 min; 30 leaves
              # ample headroom. Step-level timeout fails the step (not the
              # job), so continue-on-error can mask it on macOS.
              timeout-minutes: 30
              run: |
                  tox -e py
            - name: Upload coverage to Codecov
              if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: coverage.xml

    integration-tests:
        name: tier1-live-db-tests-py${{ matrix.python-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version:
                    - "3.13"
        permissions:
            contents: read
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: execsql
                    POSTGRES_PASSWORD: execsql
                    POSTGRES_DB: execsql_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready --health-interval 10s
                    --health-timeout 5s --health-retries 5
            mysql:
                image: mysql:8
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_USER: execsql
                    MYSQL_PASSWORD: execsql
                    MYSQL_DATABASE: execsql_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd "mysqladmin ping" --health-interval 10s
                    --health-timeout 5s --health-retries 5
            sqlserver:
                image: mcr.microsoft.com/mssql/server:2022-latest
                env:
                    ACCEPT_EULA: "Y"
                    MSSQL_SA_PASSWORD: "ExecSql_Test123!"
                    MSSQL_PID: "Developer"
                ports:
                    - 1433:1433
                options: >-
                    --health-cmd "/opt/mssql-tools18/bin/sqlcmd
                    -S localhost -U sa -P 'ExecSql_Test123!' -Q 'SELECT 1' -No || exit 1"
                    --health-interval 10s --health-timeout 5s --health-retries 20
        steps:
            - name: Check out repository code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
            - name: Setup Python ${{ matrix.python-version }}
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Install tkinter (Ubuntu)
              run: sudo apt-get update && sudo apt-get install -y python3-tk
            - name: Install Microsoft ODBC Driver 18 for SQL Server
              run: |
                  curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
                  curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
                  sudo apt-get update
                  sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
                  odbcinst -j
                  odbcinst -q -d
            - name: Enable MySQL LOAD DATA LOCAL INFILE
              # The MySQL importer uses LOAD DATA LOCAL INFILE, which MySQL 8
              # disables server-side by default. A service container takes no
              # command line, so it is switched on here; without it the import
              # round-trip tests skip instead of running.
              run: |
                  mysql -h 127.0.0.1 -P 3306 -u root -proot -e "SET GLOBAL local_infile = 1;"
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install ".[dev,postgres,mysql,mssql]"
            - name: Run subprocess integration tests
              run: |
                  python -m pytest tests/integration/test_postgres.py tests/integration/test_mysql.py -v --override-ini="addopts="
            - name: Run in-process DB adapter tests with 86% coverage floor
              env:
                  DISPLAY: ""
              run: |
                  python -m pytest --cov=execsql --cov-branch --cov-report=xml --cov-fail-under=86
            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: coverage.xml

    access-tests-windows:
        name: tier2-access-tests-windows
        runs-on: windows-latest
        # The Access engine install step is best-effort (the redistributable
        # download from Microsoft can be flaky on hosted runners). The
        # downstream test step IS gating — a real Access regression should
        # block the merge.
        strategy:
            fail-fast: false
            matrix:
                python-version:
                    - "3.13"
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Install Microsoft Access Database Engine 2016 (x64)
              id: install_access
              continue-on-error: true
              # The chocolatey `accessdatabaseengine-x64` package was removed
              # from the community feed; download the redistributable directly
              # from Microsoft and run it silently instead.
              run: |
                  $ErrorActionPreference = 'Stop'
                  $url = 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/AccessDatabaseEngine_X64.exe'
                  $dst = Join-Path $env:RUNNER_TEMP 'AccessDatabaseEngine_X64.exe'
                  Write-Host "Downloading $url"
                  Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing
                  Write-Host "Installing $dst"
                  $proc = Start-Process -FilePath $dst -ArgumentList '/quiet','/norestart' -Wait -PassThru
                  Write-Host "Installer exit code: $($proc.ExitCode)"
                  # 0 = success, 3010 = success but reboot pending. Anything else is a failure.
                  if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) { exit $proc.ExitCode }
              shell: pwsh
            - name: Annotate skipped Access tests
              if: steps.install_access.outcome != 'success'
              run: |
                  Write-Host "::warning::Access Database Engine install failed; Access real-driver tests skipped this run."
              shell: pwsh
            - name: Install Python dependencies
              if: steps.install_access.outcome == 'success'
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install ".[dev,odbc]" pywin32
              shell: pwsh
            - name: Run Access real-driver tests
              # Gating: a real regression in src/execsql/db/access.py blocks
              # the merge. Only runs when the install above succeeded.
              if: steps.install_access.outcome == 'success'
              env:
                  DISPLAY: ""
              run: |
                  python -m pytest tests/db/test_access_windows.py -v --override-ini="addopts="
              shell: pwsh

    build:
        name: Build distribution 📦
        runs-on: ubuntu-latest
        needs: [ lint, typecheck, pre-commit, formatter-corpus, typer-floor, docs, tests, integration-tests ]
        # Deliberately NOT gated on tags: packaging breaks must surface on a PR,
        # not at release time. Only publish/generate-release below are tag-gated.
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
              with:
                  python-version: "3.13"
                  cache: "pip"
            - name: Build sdist + wheel
              run: |
                  python -m pip install --upgrade pip
                  # twine is pinned to the version vendored by the publish job's
                  # pypa/gh-action-pypi-publish pin (its requirements/runtime.txt).
                  # That action runs its own `twine check` before uploading, so
                  # validating here with a *newer* twine can pass while the publish
                  # fails. Bump this pin and the action pin together.
                  python -m pip install build 'twine==7.0.0'
                  python -m build --sdist --wheel --outdir dist/
                  python -m twine check dist/*
            - name: Upload dist artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  name: ${{ github.event.repository.name }}
                  path: dist/

    publish:
        name: PyPI Publish 🚀
        needs: [ build ]
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        environment:
            name: pypi
            url: https://pypi.org/p/execsql2
        permissions:
            id-token: write
            contents: read
        steps:
            - name: Download dist
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
              with:
                  name: ${{ github.event.repository.name }}
                  path: dist/
            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
              with:
                  packages-dir: dist
                  skip-existing: true

    generate-release:
        name: Generate GitHub Release
        needs: [ build ]
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
            - name: Download dist
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
              with:
                  name: ${{ github.event.repository.name }}
                  path: dist/
            - name: Create release
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
              with:
                  draft: false
                  prerelease: false
                  generate_release_notes: true
                  files: |
                      dist/*

    publish-vscode:
        name: Publish VS Code extension 🧩
        needs: [ build ]
        # Only on a version tag, and only when a Marketplace token is configured.
        # Without VSCE_PAT the job is skipped rather than failed, so a release
        # still completes for anyone who has not set the secret up.
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
            - name: Check for a Marketplace token
              id: gate
              # Read through env, never interpolated into the command line.
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}
              run: |
                  if [ -n "$VSCE_PAT" ]; then
                      echo "ready=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "ready=false" >> "$GITHUB_OUTPUT"
                      echo "VSCE_PAT is not set — skipping the Marketplace publish." >> "$GITHUB_STEP_SUMMARY"
                  fi
            - name: Setup Python
              if: steps.gate.outputs.ready == 'true'
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
              with:
                  python-version: "3.13"
            # The grammar is generated from the metacommand dispatch table, so it
            # is rebuilt here rather than trusted to be current in the tree.
            - name: Regenerate the TextMate grammar
              if: steps.gate.outputs.ready == 'true'
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install .
                  python scripts/generate_vscode_grammar.py
            - name: Fail if the committed grammar is stale
              if: steps.gate.outputs.ready == 'true'
              run: git diff --exit-code -- extras/vscode-execsql/syntaxes/
            # The Marketplace refuses a version it already has, so the
            # extension version tracks the tag rather than being bumped by hand
            # in a second place.
            - name: Set the extension version from the tag
              if: steps.gate.outputs.ready == 'true'
              working-directory: extras/vscode-execsql
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  python - "$version" <<'PY'
                  import json, pathlib, sys
                  p = pathlib.Path("package.json")
                  data = json.loads(p.read_text())
                  data["version"] = sys.argv[1]
                  p.write_text(json.dumps(data, indent=2) + "\n")
                  print("extension version set to", sys.argv[1])
                  PY
            - name: Publish
              if: steps.gate.outputs.ready == 'true'
              working-directory: extras/vscode-execsql
              run: npx --yes @vscode/vsce@latest publish
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}
