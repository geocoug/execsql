---
name: ci/cd

on:
    push:
        branches:
            - main
        tags:
            - "v*"
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: lint
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.13"
            - run: python -m pip install ruff
            - run: ruff check src/ tests/
            - run: ruff format --check src/ tests/

    tests:
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - macos-latest
                    - windows-latest
                python-version:
                    - "3.10"
                    - "3.11"
                    - "3.12"
                    - "3.13"
                    - "3.14"
        name: test-${{ matrix.os }}-py${{ matrix.python-version }}
        runs-on: ${{ matrix.os }}
        # Hard cap so a hung job fails fast instead of consuming CI minutes for
        # hours. Ubuntu finishes in ~9 min and Windows in ~16 min; 30 leaves
        # ample headroom.
        timeout-minutes: 30
        # macOS jobs currently hang somewhere in the metacommand integration
        # tests (different point each run since the FileWriter fix). Marking
        # them non-blocking until we diagnose; Ubuntu + Windows still gate.
        continue-on-error: ${{ matrix.os == 'macos-latest' }}
        permissions:
            contents: read
        steps:
            - name: Check out repository code
              uses: actions/checkout@v6
            - name: Setup Python ${{ matrix.python-version }}
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Cache pip dependencies
              uses: actions/cache@v5
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{
                      hashFiles('**/pyproject.toml') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-${{ matrix.python-version }}-
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install tox
                  python -m pip install ".[dev]"
            - name: Install tkinter (Ubuntu)
              if: runner.os == 'Linux'
              run: sudo apt-get install -y python3-tk
            - name: Test with tox
              env:
                  DISPLAY: ""
              run: |
                  tox -e py
            - name: Upload coverage to Codecov
              if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
              uses: codecov/codecov-action@v6
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: coverage.xml

    integration-tests:
        name: integration-tests-py${{ matrix.python-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version:
                    - "3.13"
        permissions:
            contents: read
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: execsql
                    POSTGRES_PASSWORD: execsql
                    POSTGRES_DB: execsql_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready --health-interval 10s
                    --health-timeout 5s --health-retries 5
            mysql:
                image: mysql:8
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_USER: execsql
                    MYSQL_PASSWORD: execsql
                    MYSQL_DATABASE: execsql_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd "mysqladmin ping" --health-interval 10s
                    --health-timeout 5s --health-retries 5
            sqlserver:
                image: mcr.microsoft.com/mssql/server:2022-latest
                env:
                    ACCEPT_EULA: "Y"
                    MSSQL_SA_PASSWORD: "ExecSql_Test123!"
                    MSSQL_PID: "Developer"
                ports:
                    - 1433:1433
                options: >-
                    --health-cmd "/opt/mssql-tools18/bin/sqlcmd
                    -S localhost -U sa -P 'ExecSql_Test123!' -Q 'SELECT 1' -No || exit 1"
                    --health-interval 10s --health-timeout 5s --health-retries 20
        steps:
            - name: Check out repository code
              uses: actions/checkout@v6
            - name: Setup Python ${{ matrix.python-version }}
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Install tkinter (Ubuntu)
              run: sudo apt-get update && sudo apt-get install -y python3-tk
            - name: Install Microsoft ODBC Driver 18 for SQL Server
              run: |
                  curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
                  curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
                  sudo apt-get update
                  sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
                  odbcinst -j
                  odbcinst -q -d
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install ".[dev,postgres,mysql,mssql]"
            - name: Run subprocess integration tests
              run: |
                  python -m pytest tests/integration/test_postgres.py tests/integration/test_mysql.py -v --override-ini="addopts="
            - name: Run in-process DB adapter tests with 86% coverage floor
              env:
                  DISPLAY: ""
              run: |
                  python -m pytest --cov=execsql --cov-branch --cov-report=xml --cov-fail-under=86
            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v6
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: coverage.xml

    access-tests-windows:
        name: access-tests-windows
        runs-on: windows-latest
        # Best-effort: Access Database Engine install can be flaky on hosted
        # runners.  Failures don't gate the rest of the pipeline.
        continue-on-error: true
        strategy:
            fail-fast: false
            matrix:
                python-version:
                    - "3.13"
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Install Microsoft Access Database Engine 2016 (x64)
              run: |
                  choco install accessdatabaseengine-x64 -y --no-progress
              shell: pwsh
            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install ".[dev,odbc]" pywin32
              shell: pwsh
            - name: Run Access real-driver tests
              env:
                  DISPLAY: ""
              run: |
                  python -m pytest tests/db/test_access_windows.py -v --override-ini="addopts="
              shell: pwsh

    build:
        name: Build distribution 📦
        runs-on: ubuntu-latest
        needs: [ lint, tests, integration-tests ]
        if: startsWith(github.ref, 'refs/tags/v')
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v6
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"
                  cache: "pip"
            - name: Build sdist + wheel
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install build twine
                  python -m build --sdist --wheel --outdir dist/
                  python -m twine check dist/*
            - name: Upload dist artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ github.event.repository.name }}
                  path: dist/

    publish:
        name: PyPI Publish 🚀
        needs: [ build ]
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        environment:
            name: pypi
            url: https://pypi.org/p/execsql2
        permissions:
            id-token: write
            contents: read
        steps:
            - name: Download dist
              uses: actions/download-artifact@v8
              with:
                  name: ${{ github.event.repository.name }}
                  path: dist/
            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  packages-dir: dist
                  skip-existing: true

    generate-release:
        name: Generate GitHub Release
        needs: [ build ]
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Download dist
              uses: actions/download-artifact@v8
              with:
                  name: ${{ github.event.repository.name }}
                  path: dist/
            - name: Create release
              uses: softprops/action-gh-release@v2
              with:
                  draft: false
                  prerelease: false
                  generate_release_notes: true
                  files: |
                      dist/*
