---
name: Transaction model

on:
    schedule:
        - cron: "23 7 * * 1"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: transaction-model-${{ github.ref }}
    cancel-in-progress: false

jobs:
    transaction-model:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
              with:
                  python-version: "3.13"
            - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
            - run: uv sync --locked --no-dev --group test
            - name: Check 5000 generated transaction scripts
              env:
                  EXECSQL_MODEL_EXAMPLES: "5000"
              run: uv run --no-sync --no-dev --group test pytest tests/test_transaction_model.py -n 0 --no-cov --junitxml=transaction-model.xml
            - name: Preserve results
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
              with:
                  name: transaction-model-results
                  path: transaction-model.xml
