# Dependabot keeps the SHA-pinned GitHub Actions in ci-cd.yml up to
# date. The audit's B22 finding (F059) called out that pinning to
# major-version tags (e.g. `actions/checkout@v6`) is supply-chain
# exposure — an attacker who compromises the repo can retag any v6.x
# release to point at malicious code and every consumer pulls it on
# the next run. Pinning to a 40-char SHA closes that hole, but the
# pins must be refreshed when upstream ships a real new release;
# Dependabot files a PR with the new SHA and a CHANGELOG link.
version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions-minor-and-patch:
              patterns:
                  - "*"
              update-types:
                  - minor
                  - patch
    # Python packages in uv.lock (the development environment; users resolve
    # their own versions from pyproject.toml). ruff is bumped through the
    # pre-commit entry below: tests/test_tooling_versions.py requires the
    # uv.lock ruff to equal the pre-commit rev, so on that PR run
    # `uv lock --upgrade-package ruff==<new version>` and push.
    - package-ecosystem: uv
      directory: /
      schedule:
          interval: weekly
      # sqlglot is pinned (pyproject formatter extra, .pre-commit-hooks.yaml):
      # its output changes between releases, so a bump is deliberate. Bump all
      # three together, `uv lock --upgrade-package sqlglot==<new>`, and run the
      # formatter corpus (CLAUDE.md) before merging.
      ignore:
          - dependency-name: ruff
          - dependency-name: sqlglot
      groups:
          python-minor-and-patch:
              patterns:
                  - "*"
              update-types:
                  - minor
                  - patch
    # Hook revs in .pre-commit-config.yaml.
    - package-ecosystem: pre-commit
      directory: /
      schedule:
          interval: weekly
      groups:
          pre-commit-hooks:
              patterns:
                  - "*"
    # The VS Code extension's language client and its packaging tool.
    - package-ecosystem: npm
      directory: /extras/vscode-execsql
      schedule:
          interval: weekly
      groups:
          vscode-extension:
              patterns:
                  - "*"
