- id: execsql-format
  name: execsql-format
  description: Format execsql SQL scripts — normalize metacommand indentation and uppercase keywords.
  entry: execsql format
  language: python
  types: [file]
  files: \.sql$
  args: [--in-place]
  # One sqlglot: its output changes between releases, so an unpinned hook
  # formats differently depending on when its env was built (#72). Keep equal
  # to the formatter extra and uv.lock (tests/test_tooling_versions.py).
  additional_dependencies: ["sqlglot==30.21.0"]

- id: execsql-lint
  name: execsql-lint
  description: Statically check execsql SQL scripts without a database — unclosed blocks, undefined or unused variables, missing INCLUDE targets, unreachable code.
  entry: execsql lint
  language: python
  types: [file]
  files: \.sql$
