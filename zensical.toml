# Curated public Markdown exports; omit generated API internals and historical release notes.
[project.plugins.llmstxt.sections]
"Start here" = ["index.md", "getting-started/installation.md", "getting-started/first-script.md", "getting-started/requirements.md"]
"Commands" = ["reference/cli/*.md", "getting-started/syntax.md", "guides/formatter.md", "reference/lint.md"]
"Scripting" = ["reference/configuration.md", "reference/metacommands.md", "reference/substitution_vars.md", "reference/security.md", "guides/usage.md", "guides/sql_syntax.md"]
"Recipes" = ["guides/examples.md", "guides/examples/*.md", "templates/*.md"]
"Editors and Python API" = ["guides/editors.md", "guides/editors/*.md", "reference/language-server.md", "api/index.md"]
