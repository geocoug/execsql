[project]
site_name = "execsql2"
site_author = "Caleb Grant"
site_description = "A multi-DBMS SQL script processor"
site_url = "https://execsql2.readthedocs.io/en/stable/"
repo_url = "https://github.com/geocoug/execsql"
repo_name = "geocoug/execsql"
docs_dir = "docs"
# These are public script-template guides; Zensical excludes templates/ by default.
exclude_docs = "!/templates/"
copyright = "Copyright &copy; 2007-2025 R.Dreas Nielsen, 2026-present Caleb Grant"
nav = [
    { "Home" = "index.md" },
    { "Getting Started" = [
        { "Installation" = "getting-started/installation.md" },
        { "Your First Script" = "getting-started/first-script.md" },
        { "Database Support & Requirements" = "getting-started/requirements.md" }
    ] },
    { "Commands" = [
        { "Overview" = "reference/cli/index.md" },
        { "execsql run" = "getting-started/syntax.md" },
        { "execsql format" = "guides/formatter.md" },
        { "execsql lint" = "reference/lint.md" },
        { "execsql config" = "reference/cli/config.md" },
        { "execsql list" = "reference/cli/list.md" },
        { "execsql init" = "reference/cli/init.md" },
        { "execsql lsp" = "reference/cli/lsp.md" },
        { "execsql inspect" = "reference/cli/inspect.md" }
    ] },
    { "Scripting" = [
        { "Reference" = [
            { "Metacommands" = "reference/metacommands.md" },
            { "Substitution Variables" = "reference/substitution_vars.md" },
            { "Configuration" = "reference/configuration.md" },
            { "Security" = "reference/security.md" },
            { "Schema discovery" = "reference/schema.md" }
        ] },
        { "Guides" = [
            { "SQL Syntax" = "guides/sql_syntax.md" },
            { "Execution & Transactions" = "guides/usage.md" },
            { "Logging" = "guides/logging.md" },
            { "Documenting Script Actions" = "guides/documentation.md" },
            { "Character Encoding" = "guides/encoding.md" },
            { "Using Script Files" = "guides/using_scripts.md" },
            { "Debugging" = "guides/debugging.md" }
        ] }
    ] },
    { "Examples & Templates" = [
        { "Examples by Task" = [
            { "Overview" = "guides/examples.md" },
            { "Basics & Variables" = "guides/examples/basics.md" },
            { "Data Movement & Validation" = "guides/examples/data-movement.md" },
            { "Control Flow" = "guides/examples/control-flow.md" },
            { "Reports & External Commands" = "guides/examples/reports.md" },
            { "Interactive Tools & Debugging" = "guides/examples/interactive.md" }
        ] },
        { "Script Templates" = [
            { "Overview" = "templates/index.md" },
            { "Upsert" = "templates/upsert.md" },
            { "Compare" = "templates/compare.md" },
            { "Glossary" = "templates/glossary.md" }
        ] }
    ] },
    { "Editors" = [
        { "Setup & Overview" = "guides/editors.md" },
        { "VS Code" = "guides/editors/vscode.md" },
        { "Other Editors" = "guides/editors/other-editors.md" },
        { "Language-server Features" = "reference/language-server.md" }
    ] },
    { "Development" = [
        { "Contributing" = "dev/contributing.md" },
        { "Python Library API" = [
            { "Overview & Examples" = "api/index.md" },
            { "CLI Internals" = "api/cli.md" },
            { "Databases" = "api/db.md" },
            { "Exporters" = "api/exporters.md" },
            { "Importers" = "api/importers.md" },
            { "Metacommands" = "api/metacommands.md" }
        ] },
        { "Architecture" = "dev/architecture.md" },
        { "Extension Development" = [
            { "Adding Metacommands" = "dev/adding_metacommands.md" },
            { "Adding Exporters" = "dev/adding_exporters.md" },
            { "Adding Importers" = "dev/adding_importers.md" },
            { "Adding Database Adapters" = "dev/adding_db_adapters.md" }
        ] },
        { "Release Process" = "dev/releasing.md" }
    ] },
    { "About" = [
        { "Changes from Upstream" = "about/divergence.md" },
        { "Changelog" = "about/change_log.md" },
        { "Copyright" = "about/copyright.md" },
        { "Contributors" = "about/contributors.md" }
    ] }
]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
show_source = false
show_if_no_docstring = true
merge_init_into_class = true
show_signature_annotations = false

[project.theme]
features = [
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.sections",
    "navigation.indexes",
    "navigation.path",
    "navigation.tracking",
    "navigation.top",
    "toc.follow",
    "search.highlight",
    "content.code.copy",
    "content.action.copy",
    "content.code.annotate",
    "content.tabs.link",
]

logo = "images/execsql_logo_01.png"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Markdown extensions
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
[[project.markdown_extensions.pymdownx.superfences.custom_fences]]
name = "mermaid"
class = "mermaid"
format = "pymdownx.superfences.fence_code_format"

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

# Preserve published section bookmarks after splitting editor and example pages.
[project.plugins.redirects.redirect_maps]
"guides/examples.md#example1" = "guides/examples/basics.md#example1"
"guides/examples.md#example5" = "guides/examples/basics.md#example5"
